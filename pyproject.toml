[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teams-local-agent"
version = "0.1.0"
description = "Local Teams Web drafting assistant with human approval"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.48",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "openpyxl>=3.1.5",
  "pypdf>=5.0",
  "defusedxml>=0.7.1",
  "pypdfium2>=4.30",
  "pillow>=10.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
teams-agent = "app.main:main"
mail-invoices = "mail_invoices.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--capture=sys"
