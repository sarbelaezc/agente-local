[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-local"
version = "0.1.0"
description = "Agente local con aprobación humana: facturas de Hotmail y cierre mensual de gastos con Ollama"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.48",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "openpyxl>=3.1.5",
  "pypdf>=5.0",
  "defusedxml>=0.7.1",
  "pypdfium2>=4.30",
  "pillow>=10.4",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
mail-invoices = "mail_invoices.main:main"
monthly-close = "monthly_close.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monthly_close = ["dashboard.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--capture=sys"
